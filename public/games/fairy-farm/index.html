<style>
#game-web-splash{position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;overflow:hidden;background:#172018;color:#644026;font-family:system-ui,sans-serif}

#game-web-splash [hidden]{display:none}
</style>
<div id="game-web-splash" role="status" aria-live="polite">
  <img src="assets/fairy-farm-startup/native/5c/5c406eaa-d271-4b2d-88d6-675c8b184a9a.b5851.jpg" alt="溪谷物语"/>

</div>
