<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>小牛去哪儿</title>
  <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1,minimum-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <meta name="renderer" content="webkit">
  <meta name="force-rendering" content="webkit">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="full-screen" content="yes">
  <meta name="x5-fullscreen" content="true">
  <link rel="stylesheet" type="text/css" href="style.02f4a.css">
  <link rel="stylesheet" type="text/css" href="cow-splash.9357a.css">
</head>
<body>
  <div id="GameDiv" cc_exact_fit_screen="true">
    <div id="Cocos3dGameContainer">
      <canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="99"></canvas>
    </div>
    <div id="CowSplash" class="cow-splash" role="dialog" aria-label="小牛去哪儿正在启动" aria-modal="true">
  <img class="cow-splash__background" src="./splash/meadow.jpg" alt="">
  <img class="cow-splash__ground" src="./splash/ground.png" alt="">
  <div class="cow-splash__stage">
    <header class="cow-splash__heading">
      <img class="cow-splash__title" src="./splash/title.png" alt="小牛去哪儿">
      <p>一起来找小牛吧</p>
    </header>
    <div class="cow-splash__hero"><img src="./splash/cow.png" alt="微笑的小牛"></div>
    <div class="cow-splash__loading">
      <div class="cow-splash__track" role="progressbar" aria-label="启动阶段" aria-valuemin="0" aria-valuemax="3" aria-valuenow="0" aria-valuetext="正在唤醒小牛">
        <div class="cow-splash__meter">
          <div class="cow-splash__fill"></div>
          <img class="cow-splash__head" src="./splash/avatar.png" alt="">
        </div>
      </div>
      <p class="cow-splash__status" role="status" aria-live="polite">正在唤醒小牛…</p>
      <button class="cow-splash__retry" type="button" hidden>重新加载</button>
      <p class="cow-splash__tip">慢慢观察，找到藏起来的小牛</p>
    </div>
  </div>
  <p class="cow-splash__orientation">请竖屏游玩</p>
</div>

  </div>
  <script src="cow-splash.4c3a6.js"></script>
  

<!-- Polyfills bundle. -->

<script src="src/polyfills.bundle.5adbf.js" charset="utf-8"> </script>


<!-- SystemJS support. -->
<script src="src/system.bundle.543e6.js" charset="utf-8"> </script>

<!-- Import map -->
<script src="src/import-map.e2d68.json" type="systemjs-importmap" charset="utf-8"> </script>

<script>
    System.import('./index.7be61.js').catch(function(err) { console.error(err); })
</script>

</body>
</html>
